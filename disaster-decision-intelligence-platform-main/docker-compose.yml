version: "3.9"

services:

  api:
    build: .
    container_name: disaster-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres

    restart: unless-stopped

  postgres:
    image: postgres:16

    container_name: disaster-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aks@123
      POSTGRES_DB: disaster_decision_intelligence

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: